[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dashbite"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "joblib>=1.3",
    "scikit-learn>=1.2",
    "streamlit>=1.30",
    "uvicorn>=0.29",
]

[tool.setuptools]
packages = ["api", "pipeline", "dashboard"]

[tool.pytest.ini_options]
markers = [
    "unit: fast isolated tests",
    "regression: tests protecting established behavior",
    "integration: tests spanning filesystem or process boundaries",
]
testpaths = ["tests"]
